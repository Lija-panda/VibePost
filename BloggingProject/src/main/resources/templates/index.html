<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Blog Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{
            font-family:'Poppins',sans-serif;
            min-height:100vh;
            background:linear-gradient(135deg,#eef2ff,#fdf2f8,#ecfeff);
            overflow-x:hidden;
        }
        .background-circle{
            position:absolute;
            border-radius:50%;
            filter:blur(60px);
            opacity:0.5;
            z-index:-1;
        }
        .circle1{ width:300px; height:300px; background:#c4b5fd; top:-80px; left:-80px; }
        .circle2{ width:350px; height:350px; background:#f9a8d4; bottom:-100px; right:-100px; }
        .main-container{ padding:50px 20px; }
        .glass-card{
            background:rgba(255,255,255,0.75);
            backdrop-filter:blur(15px);
            border-radius:30px;
            padding:35px;
            box-shadow:0 10px 40px rgba(0,0,0,0.08);
            animation:fadeIn 1s ease;
        }
        @keyframes fadeIn{
            from{ opacity:0; transform:translateY(20px); }
            to{ opacity:1; transform:translateY(0); }
        }
        .heading{
            font-size:42px;
            font-weight:700;
            background:linear-gradient(to right,#6366f1,#ec4899);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }
        .sub-heading{ color:#6b7280; margin-top:5px; }
        .add-btn{
            background:linear-gradient(135deg,#6366f1,#8b5cf6);
            color:white; border:none; border-radius:14px;
            padding:12px 24px; font-weight:500; transition:0.3s;
            box-shadow:0 6px 15px rgba(99,102,241,0.3);
            text-decoration: none;
            display: inline-block;
        }
        .add-btn:hover{ transform:translateY(-3px); box-shadow:0 10px 20px rgba(99,102,241,0.4); color: white; }
        .table-box{ margin-top:35px; border-radius:25px; overflow:hidden; background:white; }
        thead{ background:linear-gradient(to right,#c4b5fd,#f9a8d4); }
        th{ padding:18px !important; border:none !important; color:#374151; font-size:15px; }
        td{ padding:20px !important; vertical-align:middle; }
        tbody tr:hover{ background:#f9fafb; transform:scale(1.005); transition: 0.2s; }
        .title-text{ font-weight:600; color:#111827; }
        .author-badge{
            background:#ede9fe; color:#6d28d9; padding:8px 14px;
            border-radius:30px; font-size:14px; font-weight:500;
        }
        .content-preview {
            max-width: 250px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #6b7280;
            font-size: 14px;
        }
        .action-btn{ border:none; padding:10px 15px; border-radius:12px; font-size:14px; font-weight:500; transition:0.3s; text-decoration: none; display: inline-block; }
        .edit-btn{ background:#dcfce7; color:#166534; }
        .edit-btn:hover{ background:#86efac; color:#166534; }
        .delete-btn{ background:#fee2e2; color:#b91c1c; }
        .delete-btn:hover{ background:#fca5a5; color:#b91c1c; }
        .top-bar{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px; }
        .search-input{
            border:none; padding:14px; border-radius:15px; width:100%;
            outline:none; box-shadow:0 4px 15px rgba(0,0,0,0.05); margin-top:25px;
        }
    </style>
</head>
<body>

<div class="background-circle circle1"></div>
<div class="background-circle circle2"></div>

<div class="container main-container">
    <div class="glass-card">
        <div class="top-bar">
            <div>
                <h1 class="heading">✨ Blog Dashboard</h1>
                <p class="sub-heading">Manage your blog posts beautifully.</p>
            </div>
            <a th:href="@{/new}" class="add-btn">
                <i class="bi bi-plus-circle-fill"></i> Add New Post
            </a>
        </div>

        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search blog posts..." onkeyup="searchPosts()">

        <div class="table-box">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Content</th> <!-- ADDED THIS HEADER -->
                    <th width="240">Actions</th>
                </tr>
                </thead>
                <tbody id="postTable">
                <tr th:each="p : ${listPosts}">
                    <td class="title-text" th:text="${p.title}"></td>
                    <td>
                        <span class="author-badge" th:text="${p.author}"></span>
                    </td>
                    <td>
                        <div class="content-preview" th:text="${p.content}"></div>
                    </td>
                    <td>
                        <a th:href="@{/edit/{id}(id=${p.id})}" class="action-btn edit-btn">
                            <i class="bi bi-pencil-square"></i> Edit
                        </a>
                        <button class="action-btn delete-btn ms-2" th:onclick="|deletePost(${p.id})|">
                            <i class="bi bi-trash-fill"></i> Delete
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function searchPosts() {
        let input = document.getElementById("searchInput").value.toLowerCase();
        let rows = document.querySelectorAll("#postTable tr");
        rows.forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(input) ? "" : "none";
        });
    }

    function deletePost(id){
        if(confirm("Are you sure you want to delete this post?")){
            window.location.href = "/delete/" + id;
        }
    }
</script>

</body>
</html>
