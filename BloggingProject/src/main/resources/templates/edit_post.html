<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Blog Post</title>
    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{
            font-family:'Poppins',sans-serif;
            min-height:100vh;
            background:linear-gradient(135deg,#eef2ff,#fdf2f8,#ecfeff);
            overflow:hidden;
        }
        .bg-circle{ position:absolute; border-radius:50%; filter:blur(70px); opacity:0.5; z-index:-1; }
        .circle1{ width:300px; height:300px; background:#c4b5fd; top:-100px; left:-100px; }
        .circle2{ width:350px; height:350px; background:#f9a8d4; bottom:-120px; right:-120px; }
        .main-container{ min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; }
        .glass-card{
            width:100%; max-width:700px;
            background:rgba(255,255,255,0.75); backdrop-filter:blur(15px);
            border-radius:30px; padding:40px; box-shadow:0 10px 40px rgba(0,0,0,0.08);
            animation:fadeIn 0.8s ease;
        }
        @keyframes fadeIn{ from{ opacity:0; transform:translateY(20px); } to{ opacity:1; transform:translateY(0); } }
        .heading{
            text-align:center; font-size:38px; font-weight:700; margin-bottom:10px;
            background:linear-gradient(to right,#6366f1,#ec4899);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        .sub-heading{ text-align:center; color:#6b7280; margin-bottom:35px; }
        .form-label{ font-weight:500; color:#374151; margin-bottom:8px; }
        .form-control{
            border:none; padding:14px; border-radius:15px; background:#f9fafb;
            box-shadow:0 3px 10px rgba(0,0,0,0.05); transition:0.3s;
        }
        .form-control:focus{ box-shadow:0 0 0 4px rgba(99,102,241,0.2); border:none; outline: none; }
        .btn-update{
            width:100%; padding:14px; border:none; border-radius:15px;
            background:linear-gradient(135deg,#10b981,#059669);
            color:white; font-size:17px; font-weight:600; transition:0.3s;
            box-shadow:0 6px 15px rgba(16,185,129,0.3);
        }
        .btn-update:hover{ transform:translateY(-2px); box-shadow:0 10px 20px rgba(16,185,129,0.4); }
        .back-btn{ text-decoration:none; display:inline-block; margin-top:18px; color:#6366f1; font-weight:500; }
    </style>
</head>
<body>

<div class="bg-circle circle1"></div>
<div class="bg-circle circle2"></div>

<div class="main-container">
    <div class="glass-card">
        <h1 class="heading">✍️ Edit Your Post</h1>
        <p class="sub-heading">Refine your thoughts and update your story.</p>

        <form th:action="@{/save}" th:object="${post}" method="post">

            <!-- CRITICAL: Hidden ID field ensures we UPDATE instead of CREATE -->
            <input type="hidden" th:field="*{id}">

            <div class="mb-4">
                <label class="form-label"><i class="bi bi-card-text"></i> Post Title</label>
                <input type="text" th:field="*{title}" class="form-control" required>
            </div>

            <div class="mb-4">
                <label class="form-label"><i class="bi bi-person-circle"></i> Author Name</label>
                <input type="text" th:field="*{author}" class="form-control" required>
            </div>

            <div class="mb-4">
                <label class="form-label"><i class="bi bi-pencil-square"></i> Blog Content</label>
                <textarea th:field="*{content}" rows="6" class="form-control" required></textarea>
            </div>

            <button type="submit" class="btn-update">
                <i class="bi bi-check-circle-fill"></i> Save Changes
            </button>
        </form>

        <div class="text-center">
            <a href="/" class="back-btn"><i class="bi bi-arrow-left-circle"></i> Cancel and Return</a>
        </div>
    </div>
</div>

</body>
</html>
